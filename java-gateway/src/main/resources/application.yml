server:
  port: 8080

spring:
  datasource:
    # 数据库连接地址
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/ai_town_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        concurrency: ${RESULT_CONSUMER_CONCURRENCY:1}
        max-concurrency: ${RESULT_CONSUMER_MAX_CONCURRENCY:2}
        prefetch: ${RESULT_CONSUMER_PREFETCH:10}

chat:
  websocket:
    core-threads: ${WS_PUSH_CORE_THREADS:2}
    max-threads: ${WS_PUSH_MAX_THREADS:4}
    queue-capacity: ${WS_PUSH_QUEUE_CAPACITY:100}
  scene:
    max-npcs: ${MAX_NPCS_PER_SCENE:3}
    rounds: ${SCENE_ROUNDS:1}
    max-model-calls: ${MAX_LLM_CALLS_PER_TASK:3}
  npc-interaction:
    enabled: ${NPC_AUTONOMOUS_ENABLED:false}
    interval-ms: ${NPC_INTERACTION_INTERVAL_MS:300000}
    max-per-day: ${NPC_INTERACTION_MAX_PER_DAY:4}
    cooldown-seconds: ${NPC_INTERACTION_COOLDOWN_SECONDS:3600}
  outbox:
    publish-interval-ms: 500
  task:
    timeout-seconds: 90
    max-compensations: 3
    recovery-interval-ms: 15000

auth:
  required: ${AUTH_REQUIRED:true}
  token-secret: ${PLAYER_TOKEN_SECRET:}
  ttl-seconds: ${PLAYER_TOKEN_TTL_SECONDS:2592000}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
